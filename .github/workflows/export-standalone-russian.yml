name: Export standalone Russian skill
on:
  push:
    branches: [temp/standalone-russian-export-20261016]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and stage standalone skill
        run: |
          set -euo pipefail
          test -f skills/russian-translation/SKILL.md
          test -f skills/russian-translation/agents/openai.yaml
          test -f skills/russian-translation/assets/icon.svg
          test -f skills/russian-translation/references/qa-policy.md
          python3 - <<'PY'
          from pathlib import Path
          p=Path("skills/russian-translation")
          s=(p/"SKILL.md").read_text()
          qa=(p/"references/qa-policy.md").read_text()
          assert "Mandatory Russian slash rule" in s
          assert "Mandatory lowercase after slash" in s
          assert "Mandatory Russian forward-slash QA" in qa
          assert "preserve" in s.lower()
          assert not any(p.rglob("*.py")), "Standalone skill must not require scripts"
          print("Validated",sum(x.is_file() for x in p.rglob("*")),"files")
          PY
          mkdir -p dist
          cp -a skills/russian-translation dist/russian-translation
      - name: Upload ZIP containing standalone skill
        uses: actions/upload-artifact@v4
        with:
          name: russian-translation-standalone-2026-10-16
          path: dist/
          retention-days: 2
          if-no-files-found: error
